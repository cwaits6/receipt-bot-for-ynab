name: Container Build
# Buildah multi-arch build via the shared workflow. Pull requests push an image
# tagged with the branch name; a release tag (v*) pushes that version and latest.
on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    uses: krypsis-io/.github/.github/workflows/container-build.yml@main
    with:
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
