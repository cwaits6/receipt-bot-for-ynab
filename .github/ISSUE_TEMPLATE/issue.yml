name: Issue
description: A bug, a rough edge, or something new.
body:
  - type: markdown
    attributes:
      value: |
        Title: plain English, the change to make — `Ask before splitting a gift card payment`. No type prefix; the PR adds it.
        Never paste real receipts, addresses, order numbers, tokens or phone numbers. Redact or make up the values.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's wrong or missing, from the person's side. One paragraph.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      description: What kind of work it is.
      options:
        - bug
        - polish
        - feature
        - perf
        - refactor
        - chore
        - docs
        - ci
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: Who
      description: Whose experience this changes.
      multiple: true
      options:
        - household member
        - operator
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      description: Part of the bot.
      multiple: true
      options:
        - Signal group
        - reading documents (parsers, PDF, model fallback)
        - categories and rules
        - posting to YNAB
        - reconciliation and recurring
        - scripts
        - deployment and CI
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, plainly. Leave blank if you're only reporting a problem.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Outcomes someone can check — what the bot says, what lands in YNAB, what the ledger records.
      value: |
        - [ ]
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Optional. Adjacent changes this deliberately doesn't make.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Related issues, PRs, files. Synthetic examples only.
